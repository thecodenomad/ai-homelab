##########
# Ollama #
##########

# Just Ollama for API support, no WebUI
#    image: ollama/ollama:latest
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ./mounts/ollama:/root/.ollama:Z
    environment:
      - OLLAMA_FLASH_ATTENTION=1    # Efficiency Flag
      - OLLAMA_KV_CACHE_TYPE=q8_0   # Quantize the Context Memory
      - OLLAMA_NUM_CTX=8192         # Context Window Default
      - OLLAMA_MAX_LOADED_MODELS=1  # Only one needed at a time
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  openweb:
    image: ghcr.io/open-webui/open-webui:latest
    ports: 
      - "8080:8080"
    volumes:
      - ./mounts/ollama-data:/app/backend/data:Z
    environment:
      - 'OLLAMA_BASE_URL=http://ollama:11434'
      - 'WEBUI_SECRET_KEY='
    depends_on:
      - ollama
#      - webui
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]    

####################
# Stable Diffusion #
####################

  webui:
    build:
      context: .
      dockerfile: podman/Containerfile
      target: webui
      pull_policy: never
    image: webui:latest
    ports:
      - "7860:7860"
    volumes:
      - ./mounts/models:/app/models:Z
      - ./outputs:/app/outputs:Z
    environment:
      - PYTHONUNBUFFERED=1
      - COMMANDLINE_ARGS=--opt-sdp-attention --xformers --api --disable-safe-unpickle --enable-insecure-extension-access
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
#        limits:
#          memory: 12g

###########
# ComfyUI #
###########

  comfyui:
    build:
      context: .
      dockerfile: podman/Containerfile
      target: comfyui 
      pull_policy: never
    image: comfyui:latest
    ports:
      - "7861:7861"
    volumes:
#      - ./mounts/models/Stable-diffusion:/app/models/checkpoints:Z
#      - ./mounts/models/VAE:/app/models/vae:Z
#      - ./mounts/models/VAE-approx:/app/models/vae_approx:Z
#      - ./mounts/models/Lora:/app/models/loras:Z
#      - ./mounts/models/hypernetworks:/app/models/hypernetworks:Z
      - ./mounts/models:/opt/models:Z
      - ./mounts/custom_nodes:/opt/custom_nodes:Z
      - ./outputs/comfyui:/app/output:Z
    environment:
      - PYTHONUNBUFFERED=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
 #       limits:
 #         memory: 12g    

####################
# Voice Generation #
####################

  openaudio:
    build:
      context: .
      dockerfile: podman/Containerfile.openaudio
      pull_policy: never
    image: fish-speech:latest 
    volumes:
      - ./mounts/openaudio/checkpoints:/opt/fish-speech/checkpoints:Z
      - ./mounts/openaudio/references:/opt/fish-speech/references:Z
    ports:
      - "8081:7860"
    environment:
      - COMPILE=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1 
              capabilities: [gpu]
    restart: unless-stopped

####################
# Music Generation #
####################

  ace:
    build:
      context: .
      dockerfile: podman/Containerfile
      target: ace 
      pull_policy: never
    image: ace:latest
    ports:
      - "7862:7862"
    volumes:
      - ./mounts/ace/checkpoints:/app/checkpoints:Z
      - ./outputs:/app/outputs:Z
      - ./logs:/app/logs:Z
    environment:
      - PYTHONUNBUFFERED=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
#        limits:
#          memory: 12g

